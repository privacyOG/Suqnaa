name: suqnaa

x-runtime: &runtime
  env_file:
    - ${SUQNAA_ENV_FILE:-../.env.production}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - application
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: ${SUQNAA_LOG_MAX_SIZE:-10m}
      max-file: "${SUQNAA_LOG_MAX_FILES:-5}"

x-worker: &worker
  <<: *runtime
  image: ${SUQNAA_WORKER_IMAGE:-suqnaa-worker:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: worker
  healthcheck:
    test: ["CMD", "node", "-e", "process.kill(1,0)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  api:
    <<: *runtime
    image: ${SUQNAA_API_IMAGE:-suqnaa-api:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      OBSERVABILITY_METRICS_TOKEN_FILE: /run/secrets/observability_metrics_token
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
    secrets:
      - observability_metrics_token
      - turnstile_secret_key
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4000/v1/health/ready')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    <<: *runtime
    image: ${SUQNAA_WEB_IMAGE:-suqnaa-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required at web build time}
        NEXT_PUBLIC_CHALLENGE_SCRIPT_URL: ${NEXT_PUBLIC_CHALLENGE_SCRIPT_URL:-}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-listings:
    <<: *worker
    command: ["node", "apps/api/dist/workers/listing-lifecycle-worker.js"]

  worker-discovery:
    <<: *worker
    command: ["node", "apps/api/dist/workers/discovery-notification-worker.js"]

  worker-notifications:
    <<: *worker
    command: ["node", "apps/api/dist/workers/notification-delivery-worker.js"]

  worker-settlements:
    <<: *worker
    command: ["node", "apps/api/dist/workers/seller-settlement-worker.js"]

  worker-disputes:
    <<: *worker
    command: ["node", "apps/api/dist/workers/dispute-deadline-worker.js"]

  worker-returns:
    <<: *worker
    command: ["node", "apps/api/dist/workers/return-deadline-worker.js"]

  migrate:
    env_file:
      - ${SUQNAA_ENV_FILE:-../.env.production}
    image: ${SUQNAA_MIGRATE_IMAGE:-suqnaa-migrate:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - application
    profiles:
      - migrate

secrets:
  observability_metrics_token:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/observability_metrics_token
  turnstile_secret_key:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/turnstile_secret_key

networks:
  application:
    external: true
    name: ${SUQNAA_APPLICATION_NETWORK:-suqnaa-application}
