name: suqnaa-infrastructure

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUQNAA_POSTGRES_DB:-suqnaa}
      POSTGRES_USER: ${SUQNAA_POSTGRES_USER:-suqnaa}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
        --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync always
        --maxmemory-policy noeviction
        --requirepass "$$(cat /run/secrets/queue_password)"
    secrets:
      - queue_password
    volumes:
      - queue_data:/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/queue_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export MINIO_ROOT_USER="$$(cat /run/secrets/object_storage_root_user)";
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/object_storage_root_password)";
        exec /usr/bin/minio server /data --address :9000 --console-address :9001
    secrets:
      - object_storage_root_user
      - object_storage_root_password
    volumes:
      - object_storage_data:/data
    networks:
      - application
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    image: ${SUQNAA_BACKUP_IMAGE:-suqnaa-backup:local}
    restart: unless-stopped
    environment:
      BACKUP_S3_ENDPOINT: ${SUQNAA_BACKUP_S3_ENDPOINT:-http://object-storage:9000}
      BACKUP_S3_BUCKETS: ${SUQNAA_BACKUP_S3_BUCKETS:?SUQNAA_BACKUP_S3_BUCKETS is required}
      BACKUP_INTERVAL_SECONDS: ${SUQNAA_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_STARTUP_DELAY_SECONDS: ${SUQNAA_BACKUP_STARTUP_DELAY_SECONDS:-30}
      BACKUP_RETENTION_DAYS: ${SUQNAA_BACKUP_RETENTION_DAYS:-30}
    secrets:
      - backup_database_url
      - backup_age_recipient
      - backup_object_storage_access_key
      - backup_object_storage_secret_key
    volumes:
      - backup_data:/backups
    tmpfs:
      - /work:size=32m,mode=0700
    networks:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  restore-drill:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    image: ${SUQNAA_BACKUP_IMAGE:-suqnaa-backup:local}
    command: ["/opt/suqnaa-backup/restore.sh"]
    restart: "no"
    profiles:
      - restore-drill
    environment:
      RESTORE_ENVIRONMENT: ${SUQNAA_RESTORE_ENVIRONMENT:-staging}
      RESTORE_S3_ENDPOINT: ${SUQNAA_RESTORE_S3_ENDPOINT:-http://object-storage:9000}
      RESTORE_CLEAR_OBJECT_STORAGE: ${SUQNAA_RESTORE_CLEAR_OBJECT_STORAGE:-true}
      BACKUP_ID: ${SUQNAA_RESTORE_BACKUP_ID:-}
    secrets:
      - restore_database_url
      - backup_age_identity
      - restore_object_storage_access_key
      - restore_object_storage_secret_key
    volumes:
      - backup_data:/backups:ro
    tmpfs:
      - /work:size=32m,mode=0700
    networks:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SUQNAA_METRICS_RETENTION:-30d}
      - --web.enable-lifecycle
    secrets:
      - observability_metrics_token
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${SUQNAA_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:${SUQNAA_GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - application
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SUQNAA_WEB_DOMAIN: ${SUQNAA_WEB_DOMAIN:?SUQNAA_WEB_DOMAIN is required}
      SUQNAA_API_DOMAIN: ${SUQNAA_API_DOMAIN:?SUQNAA_API_DOMAIN is required}
      SUQNAA_WEB_UPSTREAM: ${SUQNAA_WEB_UPSTREAM:-web:3000}
      SUQNAA_API_UPSTREAM: ${SUQNAA_API_UPSTREAM:-api:4000}
      SUQNAA_ACME_EMAIL: ${SUQNAA_ACME_EMAIL:?SUQNAA_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - application
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/postgres_password
  redis_password:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/redis_password
  queue_password:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/queue_password
  object_storage_root_user:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/object_storage_root_user
  object_storage_root_password:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/object_storage_root_password
  observability_metrics_token:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/observability_metrics_token
  grafana_admin_password:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/grafana_admin_password
  backup_database_url:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/backup_database_url
  backup_age_recipient:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/backup_age_recipient
  backup_object_storage_access_key:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/backup_object_storage_access_key
  backup_object_storage_secret_key:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/backup_object_storage_secret_key
  backup_age_identity:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/backup_age_identity
  restore_database_url:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/restore_database_url
  restore_object_storage_access_key:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/restore_object_storage_access_key
  restore_object_storage_secret_key:
    file: ${SUQNAA_SECRET_DIR:-./secrets}/restore_object_storage_secret_key

volumes:
  postgres_data:
  redis_data:
  queue_data:
  object_storage_data:
  backup_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  application:
    name: ${SUQNAA_APPLICATION_NETWORK:-suqnaa-application}
    driver: bridge
    internal: true
  edge:
    name: ${SUQNAA_EDGE_NETWORK:-suqnaa-edge}
    driver: bridge
