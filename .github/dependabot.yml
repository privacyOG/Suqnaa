version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      web-runtime-version-updates:
        applies-to: version-updates
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      web-runtime-security-updates:
        applies-to: security-updates
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: "/deploy/backup"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
