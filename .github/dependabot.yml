version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: "/deploy/backup"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
