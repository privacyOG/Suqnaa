name: Launch Performance

on:
  pull_request:
    paths:
      - '.github/workflows/launch-performance.yml'
      - 'apps/api/src/performance/**'
      - 'apps/api/src/media/**'
      - 'apps/api/src/notifications/**'
      - 'apps/api/src/payments/**'
      - 'apps/api/src/routes/listings.ts'
      - 'apps/api/src/db/**'
      - 'infra/db/migrations/**'
      - 'scripts/migrate-database.mjs'
      - 'scripts/migration-lib.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/launch-performance.yml'
      - 'apps/api/src/performance/**'
      - 'apps/api/src/media/**'
      - 'apps/api/src/notifications/**'
      - 'apps/api/src/payments/**'
      - 'apps/api/src/routes/listings.ts'
      - 'apps/api/src/db/**'
      - 'infra/db/migrations/**'
      - 'scripts/migrate-database.mjs'
      - 'scripts/migration-lib.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-performance:
    name: Launch threshold certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: suqnaa
          POSTGRES_PASSWORD: suqnaa_dev_password
          POSTGRES_DB: suqnaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suqnaa -d suqnaa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 4000
      WEB_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@127.0.0.1:5432/suqnaa
      JWT_ACCESS_SECRET: ci-access-secret-change-in-production-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-change-in-production-32chars
      PASSWORD_PEPPER: ci-password-pepper-change-in-production-32chars
      PASSWORD_RESET_PEPPER: ci-password-reset-pepper-change-in-production-32chars
      VERIFICATION_CODE_PEPPER: ci-verification-pepper-change-in-production-32chars
      VERIFICATION_DELIVERY_PROVIDER: console
      CHALLENGE_PROVIDER: none
      SELLER_SETTLEMENT_ENABLED: 'false'
      PERFORMANCE_API_BASE_URL: http://127.0.0.1:4000
      PERFORMANCE_REPORT_PATH: performance-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply complete migration ledger
        run: node scripts/migrate-database.mjs
      - name: Start API
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/api exec tsx src/server.ts > "$RUNNER_TEMP/performance-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/performance-api.pid"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/performance-api.log" >&2
          exit 1
      - name: Run launch threshold suite
        run: pnpm --dir apps/api exec tsx src/performance/launch-performance.ts
      - name: Upload launch performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-performance-report
          path: |
            performance-report.json
            ${{ runner.temp }}/performance-api.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/performance-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/performance-api.pid")" 2>/dev/null || true
          fi
