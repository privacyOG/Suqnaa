name: Mobile Store Testing

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-store-testing.yml'
      - 'scripts/validate-mobile-store-testing.mjs'
      - 'apps/mobile/store/review/testing-tracks.json'
      - 'apps/mobile/store/review/submission-evidence.json'

permissions:
  contents: read

concurrency:
  group: mobile-store-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing-contract:
    name: Private testing evidence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Android and iOS private testing evidence
        run: node scripts/validate-mobile-store-testing.mjs
