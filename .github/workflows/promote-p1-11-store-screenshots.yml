name: Promote P1-11 Store Screenshots

on:
  push:
    branches:
      - preflight/p1-11-store-readiness
    paths:
      - .github/workflows/promote-p1-11-store-screenshots.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-p1-11-store-screenshots
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.repository == 'privacyOG/Suqnaa' && github.ref == 'refs/heads/preflight/p1-11-store-readiness'
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: preflight/p1-11-store-readiness
          fetch-depth: 0

      - name: Download approved exact-head screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9128083866'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p1-11-screenshots"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/p1-11-screenshots.zip"
          unzip -q "$RUNNER_TEMP/p1-11-screenshots.zip" -d "$RUNNER_TEMP/p1-11-screenshots"

      - name: Verify immutable artifact contents
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p1-11-screenshots"
          test "$(find android ios -type f -name '*.png' | wc -l)" -eq 24
          awk '{ path=$2; sub(/^apps\/mobile\/build\/store-screenshot-candidates\//, "", path); print $1 "  " path }' SHA256SUMS > SHA256SUMS.local
          sha256sum -c SHA256SUMS.local

      - name: Promote screenshots and reconcile manifest
        run: |
          set -euo pipefail
          rm -rf apps/mobile/store/screenshots/android apps/mobile/store/screenshots/ios
          mkdir -p apps/mobile/store/screenshots/android apps/mobile/store/screenshots/ios
          cp -a "$RUNNER_TEMP/p1-11-screenshots/android/." apps/mobile/store/screenshots/android/
          cp -a "$RUNNER_TEMP/p1-11-screenshots/ios/." apps/mobile/store/screenshots/ios/
          node scripts/reconcile-mobile-store-screenshots.mjs
          node scripts/reconcile-mobile-store-screenshots.mjs --check
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('apps/mobile/store/screenshots/manifest.json', 'utf8'));
          if (manifest.status !== 'captured_complete' || manifest.capturedCount !== 24 || manifest.requiredCount !== 24) {
            throw new Error(`Unexpected screenshot manifest state: ${manifest.status} ${manifest.capturedCount}/${manifest.requiredCount}`);
          }
          const files = manifest.sets.flatMap((set) => set.files);
          if (files.length !== 24 || files.some((file) => file.status !== 'captured' || !file.sha256 || file.width !== 1080 || file.height !== 1920)) {
            throw new Error('Screenshot manifest entries are not fully reconciled at 1080x1920 with SHA-256 fingerprints.');
          }
          NODE

      - name: Commit promoted evidence and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/promote-p1-11-store-screenshots.yml
          git config user.name 'privacyOG'
          git config user.email 'kriptiik@proton.me'
          git add -A apps/mobile/store/screenshots .github/workflows/promote-p1-11-store-screenshots.yml
          git diff --cached --check
          test "$(git diff --cached --name-only -- 'apps/mobile/store/screenshots/**/*.png' | wc -l)" -eq 24
          git commit -m 'Promote approved mobile store screenshots'
          git push origin HEAD:preflight/p1-11-store-readiness
