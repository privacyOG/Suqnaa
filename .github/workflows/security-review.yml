name: Scheduled Security Review

on:
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-review
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit Node dependency graph
        run: pnpm audit --audit-level=high

  production-security-contract:
    name: Production security contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate production security controls
        run: node scripts/validate-production-security.mjs
