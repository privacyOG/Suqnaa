name: Temporary dependency lock generator

on:
  push:
    branches:
      - preflight/dependency-lockfile

permissions:
  contents: write

jobs:
  generate:
    name: Generate dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preflight/dependency-lockfile
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify lockfile
        run: test -s pnpm-lock.yaml
      - name: Commit lockfile and remove generator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-lockfile.yml
          git config user.name privacyOG
          git config user.email 102720550+privacyOG@users.noreply.github.com
          git add pnpm-lock.yaml .github/workflows/temporary-lockfile.yml
          git commit -m "Add exact dependency lockfile"
          git push origin HEAD:preflight/dependency-lockfile
