name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    env:
      POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repository-policy.mjs

  database-and-node:
    name: Database, API and web
    needs: policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: suqnaa
          POSTGRES_PASSWORD: suqnaa_dev_password
          POSTGRES_DB: suqnaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suqnaa -d suqnaa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_fresh
      JWT_ACCESS_SECRET: ci-access-secret-change-in-production-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-change-in-production-32chars
      PASSWORD_PEPPER: ci-password-pepper-change-in-production-32chars
      PASSWORD_RESET_PEPPER: ci-password-reset-pepper-change-in-production-32chars
      VERIFICATION_CODE_PEPPER: ci-verification-pepper-change-in-production-32chars
      VERIFICATION_DELIVERY_PROVIDER: console
      CHALLENGE_PROVIDER: none
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      MIGRATION_ADMIN_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/postgres
      MIGRATION_FRESH_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_fresh
      MIGRATION_UPGRADE_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate fresh and upgrade migrations
        run: bash scripts/validate-database-migrations.sh
      - name: Typecheck
        run: pnpm typecheck
      - name: Test API and web
        env:
          NODE_ENV: test
        run: pnpm test
      - name: Build API
        run: pnpm build:api
      - name: Build web
        env:
          NODE_ENV: production
        run: pnpm build:web

  containers:
    name: Production containers and restore drill
    needs: policy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      NEXT_PUBLIC_CHALLENGE_SCRIPT_URL: ""
      SUQNAA_WEB_DOMAIN: web.example.invalid
      SUQNAA_API_DOMAIN: api.example.invalid
      SUQNAA_ACME_EMAIL: ops@example.invalid
      SUQNAA_SECRET_DIR: ./secrets
      SUQNAA_BACKUP_S3_BUCKETS: ci-media
      SUQNAA_BACKUP_IMAGE: suqnaa-backup:ci
      SUQNAA_RESTORE_ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate container topology
        run: node scripts/validate-production-containers.mjs
      - name: Validate infrastructure topology
        run: node scripts/validate-production-infrastructure.mjs
      - name: Validate production Compose configuration
        shell: bash
        run: |
          cp .env.example .env.production
          docker compose -f deploy/compose.production.yml config >/dev/null
      - name: Provision CI infrastructure secret files
        shell: bash
        working-directory: deploy
        run: |
          mkdir -p secrets
          printf '%s' 'ci-postgres-password' > secrets/postgres_password
          printf '%s' 'ci-redis-password' > secrets/redis_password
          printf '%s' 'ci-queue-password' > secrets/queue_password
          printf '%s' 'ci-object-admin' > secrets/object_storage_root_user
          printf '%s' 'ci-object-password' > secrets/object_storage_root_password
          printf '%s' 'ci-observability-token-012345678901234567890123456789' > secrets/observability_metrics_token
          printf '%s' 'ci-grafana-password' > secrets/grafana_admin_password
          printf '%s' 'postgres://suqnaa:ci-postgres-password@postgres:5432/suqnaa' > secrets/backup_database_url
          printf '%s' 'age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq' > secrets/backup_age_recipient
          printf '%s' 'ci-object-admin' > secrets/backup_object_storage_access_key
          printf '%s' 'ci-object-password' > secrets/backup_object_storage_secret_key
          printf '%s' 'AGE-SECRET-KEY-1PLACEHOLDER' > secrets/backup_age_identity
          printf '%s' 'postgres://suqnaa:ci-postgres-password@postgres:5432/suqnaa' > secrets/restore_database_url
          printf '%s' 'ci-object-admin' > secrets/restore_object_storage_access_key
          printf '%s' 'ci-object-password' > secrets/restore_object_storage_secret_key
      - name: Validate infrastructure Compose configuration
        shell: bash
        working-directory: deploy
        run: docker compose -f compose.infrastructure.yml config >/dev/null
      - name: Build API image
        run: docker build -f deploy/Dockerfile --target api -t suqnaa-api:ci .
      - name: Build worker image
        run: docker build -f deploy/Dockerfile --target worker -t suqnaa-worker:ci .
      - name: Build web image
        run: >-
          docker build -f deploy/Dockerfile --target web
          --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
          --build-arg NEXT_PUBLIC_CHALLENGE_SCRIPT_URL="$NEXT_PUBLIC_CHALLENGE_SCRIPT_URL"
          -t suqnaa-web:ci .
      - name: Build migration image
        run: docker build -f deploy/Dockerfile --target migrate -t suqnaa-migrate:ci .
      - name: Build backup image
        run: docker build -f deploy/backup/Dockerfile -t suqnaa-backup:ci .
      - name: Run encrypted staging restore drill
        shell: bash
        working-directory: deploy
        run: |
          set -Eeuo pipefail

          rm -f secrets/backup_age_identity secrets/backup_age_recipient
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/secrets:/secrets" \
            --entrypoint age-keygen \
            suqnaa-backup:ci -o /secrets/backup_age_identity
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/secrets:/secrets" \
            --entrypoint age-keygen \
            suqnaa-backup:ci -y /secrets/backup_age_identity \
            > secrets/backup_age_recipient

          docker compose -f compose.infrastructure.yml up -d --wait --wait-timeout 60 postgres object-storage

          docker compose -f compose.infrastructure.yml exec -T postgres \
            psql -U suqnaa -d suqnaa -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists schema_migrations (
            id text primary key,
            checksum text not null default 'ci',
            applied_at timestamptz not null default now()
          );
          insert into schema_migrations (id) values ('ci_restore_drill') on conflict do nothing;
          create table if not exists backup_probe (id integer primary key, value text not null);
          insert into backup_probe (id, value) values (1, 'database-before-backup')
            on conflict (id) do update set value = excluded.value;
          SQL

          docker compose -f compose.infrastructure.yml exec -T object-storage sh -ec '
            mc alias set ci http://localhost:9000 "$(cat /run/secrets/object_storage_root_user)" "$(cat /run/secrets/object_storage_root_password)" >/dev/null
            mc mb --ignore-existing ci/ci-media >/dev/null
            printf %s object-before-backup | mc pipe ci/ci-media/probe.txt >/dev/null
          '

          docker compose -f compose.infrastructure.yml run --rm --no-deps backup \
            /opt/suqnaa-backup/backup.sh

          docker compose -f compose.infrastructure.yml exec -T postgres \
            psql -U suqnaa -d suqnaa -v ON_ERROR_STOP=1 \
            -c "update backup_probe set value = 'database-after-backup' where id = 1"
          docker compose -f compose.infrastructure.yml exec -T object-storage sh -ec '
            mc alias set ci http://localhost:9000 "$(cat /run/secrets/object_storage_root_user)" "$(cat /run/secrets/object_storage_root_password)" >/dev/null
            mc rm --force ci/ci-media/probe.txt >/dev/null
          '

          docker compose --profile restore-drill -f compose.infrastructure.yml run --rm --no-deps restore-drill

          restored_db=$(docker compose -f compose.infrastructure.yml exec -T postgres \
            psql -U suqnaa -d suqnaa -Atqc "select value from backup_probe where id = 1")
          [[ "$restored_db" == "database-before-backup" ]]

          restored_object=$(docker compose -f compose.infrastructure.yml exec -T object-storage sh -ec '
            mc alias set ci http://localhost:9000 "$(cat /run/secrets/object_storage_root_user)" "$(cat /run/secrets/object_storage_root_password)" >/dev/null
            mc cat ci/ci-media/probe.txt
          ')
          [[ "$restored_object" == "object-before-backup" ]]

          docker compose -f compose.infrastructure.yml run --rm --no-deps --entrypoint sh backup -ec '
            ! find /backups -type f \( -name "*.dump" -o -name "*.sql" -o -name "*.tar" \) | grep -q .
            find /backups -type f -name "database.dump.age" | grep -q .
            find /backups -type f -name "checksums.sha256" | grep -q .
          '

          docker compose -f compose.infrastructure.yml down -v
      - name: Remove CI secret files
        if: always()
        shell: bash
        working-directory: deploy
        run: rm -rf secrets

  mobile:
    name: Mobile analysis and tests
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter gen-l10n
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - policy
      - database-and-node
      - containers
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          NODE_RESULT: ${{ needs.database-and-node.result }}
          CONTAINER_RESULT: ${{ needs.containers.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        shell: bash
        run: |
          [[ "$POLICY_RESULT" == "success" ]]
          [[ "$NODE_RESULT" == "success" ]]
          [[ "$CONTAINER_RESULT" == "success" ]]
          [[ "$MOBILE_RESULT" == "success" ]]
