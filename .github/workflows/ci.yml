name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    env:
      POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repository-policy.mjs

  database-and-node:
    name: Database, API and web
    needs: policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: suqnaa
          POSTGRES_PASSWORD: suqnaa_dev_password
          POSTGRES_DB: suqnaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suqnaa -d suqnaa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_fresh
      JWT_ACCESS_SECRET: ci-access-secret-change-in-production-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-change-in-production-32chars
      PASSWORD_PEPPER: ci-password-pepper-change-in-production-32chars
      PASSWORD_RESET_PEPPER: ci-password-reset-pepper-change-in-production-32chars
      VERIFICATION_CODE_PEPPER: ci-verification-pepper-change-in-production-32chars
      VERIFICATION_DELIVERY_PROVIDER: console
      CHALLENGE_PROVIDER: none
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      MIGRATION_ADMIN_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/postgres
      MIGRATION_FRESH_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_fresh
      MIGRATION_UPGRADE_DATABASE_URL: postgres://suqnaa:suqnaa_dev_password@localhost:5432/suqnaa_upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate fresh and upgrade migrations
        run: bash scripts/validate-database-migrations.sh
      - name: Typecheck
        run: pnpm typecheck
      - name: Test API and web
        env:
          NODE_ENV: test
        run: pnpm test
      - name: Build API
        run: pnpm build:api
      - name: Build web
        env:
          NODE_ENV: production
        run: pnpm build:web

  containers:
    name: Production containers
    needs: policy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      NEXT_PUBLIC_CHALLENGE_SCRIPT_URL: ""
      SUQNAA_WEB_DOMAIN: web.example.invalid
      SUQNAA_API_DOMAIN: api.example.invalid
      SUQNAA_ACME_EMAIL: ops@example.invalid
      SUQNAA_SECRET_DIR: ./secrets
    steps:
      - uses: actions/checkout@v4
      - name: Validate container topology
        run: node scripts/validate-production-containers.mjs
      - name: Validate infrastructure topology
        run: node scripts/validate-production-infrastructure.mjs
      - name: Validate production Compose configuration
        shell: bash
        run: |
          cp .env.example .env.production
          docker compose -f deploy/compose.production.yml config >/dev/null
      - name: Validate infrastructure Compose configuration
        shell: bash
        working-directory: deploy
        run: |
          mkdir -p secrets
          printf '%s' 'ci-postgres-password' > secrets/postgres_password
          printf '%s' 'ci-redis-password' > secrets/redis_password
          printf '%s' 'ci-queue-password' > secrets/queue_password
          printf '%s' 'ci-object-admin' > secrets/object_storage_root_user
          printf '%s' 'ci-object-password' > secrets/object_storage_root_password
          docker compose -f compose.infrastructure.yml config >/dev/null
          rm -f secrets/postgres_password secrets/redis_password secrets/queue_password secrets/object_storage_root_user secrets/object_storage_root_password
      - name: Build API image
        run: docker build -f deploy/Dockerfile --target api -t suqnaa-api:ci .
      - name: Build worker image
        run: docker build -f deploy/Dockerfile --target worker -t suqnaa-worker:ci .
      - name: Build web image
        run: >-
          docker build -f deploy/Dockerfile --target web
          --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
          --build-arg NEXT_PUBLIC_CHALLENGE_SCRIPT_URL="$NEXT_PUBLIC_CHALLENGE_SCRIPT_URL"
          -t suqnaa-web:ci .
      - name: Build migration image
        run: docker build -f deploy/Dockerfile --target migrate -t suqnaa-migrate:ci .

  mobile:
    name: Mobile analysis and tests
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter gen-l10n
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - policy
      - database-and-node
      - containers
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          NODE_RESULT: ${{ needs.database-and-node.result }}
          CONTAINER_RESULT: ${{ needs.containers.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        shell: bash
        run: |
          [[ "$POLICY_RESULT" == "success" ]]
          [[ "$NODE_RESULT" == "success" ]]
          [[ "$CONTAINER_RESULT" == "success" ]]
          [[ "$MOBILE_RESULT" == "success" ]]
