name: P1-13 Semantic Fix

on:
  push:
    branches:
      - preflight/p1-13-accessibility
    paths:
      - '.github/workflows/p1-13-semantic-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preflight/p1-13-accessibility
      - name: Add localized filter tooltip and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/src/features/home/home_screen.dart')
          source = path.read_text()
          old = "          IconButton(onPressed: onFilters, icon: const Icon(Icons.tune)),"
          new = """          IconButton(
            tooltip: Localizations.localeOf(context).languageCode == 'ar' ? 'الفلاتر' : 'Filters',
            onPressed: onFilters,
            icon: const Icon(Icons.tune),
          ),"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one filter IconButton, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/p1-13-semantic-fix.yml
          node scripts/validate-accessibility-localization.mjs
      - name: Commit semantic fix
        shell: bash
        run: |
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add apps/mobile/lib/src/features/home/home_screen.dart .github/workflows/p1-13-semantic-fix.yml
          git commit -m "Label mobile marketplace filter control"
          git push origin HEAD:preflight/p1-13-accessibility
