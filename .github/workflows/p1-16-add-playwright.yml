name: P1-16 Add Playwright

on:
  push:
    branches:
      - preflight/p1-16-browser-e2e
    paths:
      - '.github/workflows/p1-16-add-playwright.yml'

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preflight/p1-16-browser-e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add pinned Playwright test dependency
        run: pnpm --dir apps/web add --save-dev @playwright/test@1.62.0
      - name: Remove temporary dependency workflow
        run: rm .github/workflows/p1-16-add-playwright.yml
      - name: Commit lockfile-consistent dependency
        run: |
          git config user.name privacyOG
          git config user.email kriptiik@proton.me
          git add apps/web/package.json pnpm-lock.yaml .github/workflows/p1-16-add-playwright.yml
          git commit -m "Add pinned Playwright browser test dependency"
          git push origin HEAD:preflight/p1-16-browser-e2e
